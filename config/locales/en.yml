      secondary_cta: "Read the journal"
    pillars:
      eyebrow: "Coherence"
      title: "Three doors into one work"
      body: "None of the three is enough on its own. Wellbeing shows up when what the body feels, the mind thinks and the spirit reaches for stop contradicting each other."
      body_title: "Inhabit the body"
      body_text: "Breath, movement and rest as the starting point. The body registers long before the mind can name it."
      mind_title: "Quiet the mind"
      mind_text: "Clinically grounded mindfulness practice, to watch thought without being caught by it."
      spirit_title: "Listen to the spirit"
      spirit_text: "Meaning, values, whatever holds you up. Intimate work that asks you to believe nothing — only to look honestly."
    approach:
      eyebrow: "The frame"
      title: "Clinical rigour, contemplative gaze"
      body: "I am a psychiatrist. Everything I teach passes first through the filter of evidence and of personal practice. No shortcuts and no promises: tools, time and company."
      cta: "Read my background"
