# Los textos dirigidos a quien estudia se escriben en neutro: no sabemos su
# género y no hay motivo para preguntarlo. Cuando hace falta un sustantivo,
# "estudiante" sirve para cualquiera. Lo que habla de ella (la psiquiatra) sí va
# en femenino, porque ahí sí sabemos de quién hablamos.
