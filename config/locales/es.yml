      title: "Tres puertas a un mismo trabajo"
      body: "Ninguna de las tres alcanza sola. El bienestar aparece cuando lo que el cuerpo siente, la mente piensa y el espíritu busca dejan de contradecirse."
      body_title: "Habitar el cuerpo"
      body_text: "Respiración, movimiento y descanso como punto de partida. El cuerpo registra mucho antes de que la mente pueda nombrarlo."
      mind_title: "Aquietar la mente"
      mind_text: "Prácticas de atención plena con base clínica, para observar el pensamiento sin quedar atrapado en él."
      spirit_title: "Escuchar el espíritu"
      spirit_text: "El sentido, los valores, aquello que sostiene. Un trabajo íntimo que no pide creer nada: solo mirar con honestidad."
