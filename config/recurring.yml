# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # A direct upload that is abandoned before the form is submitted leaves the
  # file in the bucket with nothing pointing at it. Without this they pile up
  # and are billed forever.
  purge_abandoned_uploads:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..24.hours.ago).find_each(&:purge_later)"
    schedule: every day at 4am
